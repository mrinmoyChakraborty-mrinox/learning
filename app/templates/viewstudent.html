{% extends "base.html" %}
{% block content %}
<div class="para">
<h2>Students of class {{classname}} are :</h2>
<table border="1">
    <tr>
      <th>Name</th>
      <th>Roll</th>
    </tr>
    {% for student in students %}
    <tr>
      <td>{{ student.name }}</td>
      <td>{{ student.roll_number }}</td>
    </tr>
    {% endfor %}
</table>
</div>
{% endblock %}
